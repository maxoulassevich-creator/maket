<!-- Блок вопросов и ответов. Донор: Faqs, светлый вариант.
     Первый ответ раскрыт, ответ читается без вопроса, текст в коде страницы. -->
<section class="section section--tight has-decor">
  <script class="ann" type="application/json">
  {"section":"Блок вопросов и ответов",
   "what":"Пять-восемь вопросов в той формулировке, в какой их задают вслух, с ответами на 40–60 слов.",
   "how":"Первый ответ раскрыт, остальные свёрнуты. Ответ читается без вопроса. Размечен для поисковых систем. Текст лежит в коде страницы, а не подгружается скриптом.",
   "why":"Закрывает вопросы, из-за которых обычно звонят в магазин, и одновременно претендует на прямой ответ в поиске.",
   "src":"«Структура», сквозная секция"}
  </script>
  <div class="container">
    <div class="section-head section-head--center">
      <span class="eyebrow">Частые вопросы</span>
      <h2>{{title}}</h2>
    </div>
    <div class="accordion" style="max-width:900px;margin:0 auto">
      <details class="accordion__item" open>
        <summary class="accordion__head">{{q1}}</summary>
        <div class="accordion__body">{{a1}}</div>
      </details>
      <details class="accordion__item">
        <summary class="accordion__head">{{q2}}</summary>
        <div class="accordion__body">{{a2}}</div>
      </details>
      <details class="accordion__item">
        <summary class="accordion__head">{{q3}}</summary>
        <div class="accordion__body">{{a3}}</div>
      </details>
      <details class="accordion__item">
        <summary class="accordion__head">{{q4}}</summary>
        <div class="accordion__body">{{a4}}</div>
      </details>
      <details class="accordion__item">
        <summary class="accordion__head">{{q5}}</summary>
        <div class="accordion__body">{{a5}}</div>
      </details>
    </div>
  </div>
</section>
